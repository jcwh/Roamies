# Builds the Windows installer (Roamies_<version>_x64-setup.exe) without any signing keys, so a fork can build its own
# copy: run it by hand from the Actions tab, or push to a branch named local-voice. The installer is attached to the
# run as an artifact (Summary > Artifacts). It carries no update signature (release.yml makes the signed ones), so it
# never offers itself as an update; the app inside still checks the official feed.
name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [local-voice]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: showcase/tauri
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showcase/tauri/sidecar/package-lock.json

      - name: Install sidecar dependencies
        working-directory: showcase/tauri/sidecar
        run: npm ci

      - name: Test sidecar
        working-directory: showcase/tauri/sidecar
        run: npm test

      # The real PowerShell helper and Windows' own voices: lists them and has one speak (to memory, not a speaker).
      # A runner image without voices shouldn't stop the installer from being built.
      - name: Test this computer's own voice
        working-directory: showcase/tauri/sidecar
        continue-on-error: true
        run: node test/localvoice.win.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            showcase/tauri/src-tauri -> target
            showcase/tauri/src-tauri/voice-win -> target
            showcase/tauri/src-tauri/hands-win -> target
          key: x86_64-pc-windows-msvc

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # The Windows installer needs NSIS, which the bundler downloads from GitHub release links; those can time out
      # (504) for hours while the API still works. Fetch the same files through the API into the bundler's tools folder
      # (it skips its own download when they're there, hash-checked). If this fails, the bundler still tries itself.
      # Versions and hashes are tauri-bundler 2.10's (src/bundle/windows/nsis/mod.rs).
      - name: Prefetch NSIS for the Windows installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:LOCALAPPDATA 'tauri'; $tmp = Join-Path $env:RUNNER_TEMP 'nsis'
          New-Item -ItemType Directory -Force $dir, $tmp | Out-Null
          try {
            gh release download nsis-3.13 -R tauri-apps/binary-releases -p nsis-3.13.zip -D $tmp --clobber
            if ($LASTEXITCODE) { throw 'NSIS download failed' }
            gh release download nsis_tauri_utils-v0.5.3 -R tauri-apps/nsis-tauri-utils -p nsis_tauri_utils.dll -D $tmp --clobber
            if ($LASTEXITCODE) { throw 'nsis_tauri_utils download failed' }
            if ((Get-FileHash (Join-Path $tmp 'nsis-3.13.zip') -Algorithm SHA1).Hash -ne 'DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E') { throw 'NSIS hash mismatch' }
            if ((Get-FileHash (Join-Path $tmp 'nsis_tauri_utils.dll') -Algorithm SHA1).Hash -ne '75197FEE3C6A814FE035788D1C34EAD39349B860') { throw 'nsis_tauri_utils hash mismatch' }
            Remove-Item -Recurse -Force (Join-Path $dir 'NSIS'), (Join-Path $dir 'nsis-3.13') -ErrorAction SilentlyContinue
            Expand-Archive (Join-Path $tmp 'nsis-3.13.zip') -DestinationPath $dir
            Rename-Item (Join-Path $dir 'nsis-3.13') 'NSIS'
            $add = Join-Path $dir 'NSIS/Plugins/x86-unicode/additional'
            New-Item -ItemType Directory -Force $add | Out-Null
            Copy-Item (Join-Path $tmp 'nsis_tauri_utils.dll') $add
            Write-Host "NSIS ready in $dir"
          } catch { Write-Host "Couldn't prefetch NSIS ($_); the bundler will download it itself." }

      # tauri.unsigned.conf.json turns off the signed update bundle, which needs the release key.
      - name: Build the installer
        env:
          TAURI_BUNDLES: nsis
        run: ./build.sh release --target x86_64-pc-windows-msvc --config tauri.unsigned.conf.json

      - uses: actions/upload-artifact@v7
        with:
          name: Roamies-windows-installer
          path: showcase/tauri/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
